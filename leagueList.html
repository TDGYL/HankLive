<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HankLive - 联赛筛选</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        hank: {
                            bg: '#090a0f',
                            card: '#12141d',
                            cardHover: '#1a1d2b',
                            border: '#222638',
                            primary: '#10b981', // 体育荧光绿
                            primaryHover: '#059669',
                            accent: '#06b6d4',
                            text: '#f3f4f6',
                            muted: '#8e96a8'
                        }
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* iOS 专属滚动与交互体验 */
        body {
            background-color: #050608;
            color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            overflow-x: hidden;
        }

        .ios-scroll {
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .ios-scroll::-webkit-scrollbar {
            display: none;
        }

        /* 玻璃拟态效果 */
        .glass-nav {
            background: rgba(18, 20, 29, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .glass-bottom {
            background: rgba(18, 20, 29, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        /* iOS 安全区域内边距 */
        .pt-safe { padding-top: env(safe-area-inset-top, 47px); }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 34px); }
        .mb-safe { margin-bottom: env(safe-area-inset-bottom, 34px); }

        /* 复选框勾选动画 */
        .custom-checkbox input:checked + .checkbox-box {
            background-color: #10b981;
            border-color: #10b981;
        }
        .custom-checkbox input:checked + .checkbox-box .check-icon {
            opacity: 1;
            transform: scale(1);
        }

        /* A-Z 快速索引导航栏 */
        .alphabet-nav {
            touch-action: none;
        }

        /* 微闪烁和过渡 */
        .active-scale {
            transition: transform 0.15s ease, opacity 0.15s ease;
        }
        .active-scale:active {
            transform: scale(0.96);
            opacity: 0.85;
        }
    </style>
</head>

        let currentTab = 'hot';
        let searchQuery = '';
        let selectedLeagueIds = new Set();
        const allLeagues = liansaiJsonData.data.leagues;

        // 默认勾选热门联赛与竞彩联赛
        allLeagues.forEach(l => {
            if (l.isHot) selectedLeagueIds.add(l.id);
        });

        // DOM 节点引用
        const container = document.getElementById('league-list-container');
        const searchInput = document.getElementById('search-input');
        const searchClear = document.getElementById('search-clear');
        const alphabetNav = document.getElementById('alphabet-nav');

        // 更新状态栏实时时间
        function updateTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('current-time').textContent = `${hours}:${minutes}`;
        }
        setInterval(updateTime, 1000);
        updateTime();

        // 显示 Toast 提示
        function showToast(text) {
            const toast = document.getElementById('toast-msg');
            toast.textContent = text;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 1800);
        }

        // 过滤联赛列表逻辑
        function getFilteredLeagues() {
            return allLeagues.filter(league => {
                // 1. 搜索匹配
                if (searchQuery) {
                    const q = searchQuery.toLowerCase();
                    const matchName = league.name.toLowerCase().includes(q) || league.shortName.toLowerCase().includes(q);
                    const matchCountry = league.country.toLowerCase().includes(q);
                    const matchInitial = league.initial.toLowerCase() === q;
                    if (!matchName && !matchCountry && !matchInitial) return false;
                }

                // 2. Tab 分类匹配
                if (currentTab === 'hot') return league.isHot;
                if (currentTab === 'jc') return league.isJc;
                if (currentTab === 'level1') return league.level === 1;
                if (currentTab === 'region') return true; // 按洲分组处理
                return true; // 'all'
            });
        }

        // 渲染列表
        function renderList() {
            const list = getFilteredLeagues();
            container.innerHTML = '';

            if (list.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-16 text-zinc-500">
                        <i class="fa-regular fa-folder-open text-4xl mb-3 opacity-40"></i>
                        <p class="text-xs">未找到符合条件的联赛</p>
                    </div>
                `;
                updateCounts();
                return;
            }

            // 如果是按大洲分类
            if (currentTab === 'region' && !searchQuery) {
                alphabetNav.classList.add('hidden');
                const groups = {};
                list.forEach(item => {
                    groups[item.region] = groups[item.region] || [];
                    groups[item.region].push(item);
                });

                Object.keys(groups).forEach(regionName => {
                    renderGroupSection(regionName, groups[regionName]);
                });
            } 
            // 如果是全部或有搜索，按字母或拼音分组
            else if ((currentTab === 'all' || searchQuery) && !searchQuery) {
                alphabetNav.classList.remove('hidden');
                const groups = {};
                list.forEach(item => {
                    const key = item.initial || '#';
                    groups[key] = groups[key] || [];
                    groups[key].push(item);
                });

                const sortedKeys = Object.keys(groups).sort();
                renderAlphabetBar(sortedKeys);

                sortedKeys.forEach(key => {
                    renderGroupSection(key, groups[key], `sec-${key}`);
                });
            } 
            // 热门、竞彩、一级联赛平铺渲染
            else {
                alphabetNav.classList.add('hidden');
                renderFlatList(list);
            }

            updateCounts();
        }

        // 渲染分组区块
        function renderGroupSection(title, items, id = '') {
            const section = document.createElement('div');
            if (id) section.id = id;
            section.className = 'space-y-2';

            const header = document.createElement('div');
            header.className = 'text-xs font-bold text-hank-muted tracking-wider sticky top-0 bg-hank-bg/90 py-1 backdrop-blur-sm z-10 flex justify-between items-center px-1';
            
            const groupCheckedCount = items.filter(i => selectedLeagueIds.has(i.id)).length;
            header.innerHTML = `
                <span>${title}</span>
                <span class="text-[10px] font-normal text-zinc-500">已选 ${groupCheckedCount}/${items.length}</span>
            `;
            section.appendChild(header);

            const grid = document.createElement('div');
            grid.className = 'grid grid-cols-1 gap-2';

            items.forEach(league => {
                grid.appendChild(createLeagueCard(league));
            });

            section.appendChild(grid);
            container.appendChild(section);
        }

        // 渲染平铺列表
        function renderFlatList(items) {
            const grid = document.createElement('div');
            grid.className = 'grid grid-cols-1 gap-2';
            items.forEach(league => {
                grid.appendChild(createLeagueCard(league));
            });
            container.appendChild(grid);
        }

        // 创建单条联赛卡片组件
        function createLeagueCard(league) {
            const isChecked = selectedLeagueIds.has(league.id);
            const card = document.createElement('label');
            card.className = `custom-checkbox flex items-center justify-between p-3 rounded-2xl border transition-all duration-200 cursor-pointer active-scale ${
                isChecked 
                ? 'bg-hank-cardHover border-hank-primary/50 shadow-sm shadow-emerald-950/30' 
                : 'bg-hank-card border-hank-border/50 hover:border-hank-border'
            }`;

            card.innerHTML = `
                <div class="flex items-center space-x-3">
                    <span class="text-xl leading-none select-none">${league.flag}</span>
                    <div>
                        <div class="flex items-center gap-1.5">
                            <span class="text-sm font-semibold text-white tracking-tight">${league.shortName}</span>
                            ${league.isHot ? '<span class="px-1.5 py-0.2 text-[9px] bg-amber-500/10 text-amber-400 rounded font-medium border border-amber-500/20">热</span>' : ''}
                            ${league.isJc ? '<span class="px-1.5 py-0.2 text-[9px] bg-emerald-500/10 text-emerald-400 rounded font-medium border border-emerald-500/20">竞</span>' : ''}
                        </div>
                        <span class="text-[11px] text-zinc-400 leading-tight block mt-0.5">${league.name}</span>
                    </div>
                </div>

                <div class="flex items-center space-x-3">
                    <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-slate-800 text-zinc-300 border border-slate-700">
                        ${league.matchCount} 场
                    </span>
                    <div class="relative">
                        <input type="checkbox" data-id="${league.id}" ${isChecked ? 'checked' : ''} class="sr-only">
                        <div class="checkbox-box w-5 h-5 rounded-full border-2 border-zinc-600 flex items-center justify-center transition-all">
                            <i class="fa-solid fa-check check-icon text-[10px] text-slate-950 opacity-0 transition-all font-black"></i>
                        </div>
                    </div>
                </div>
            `;

            // 绑定勾选事件
            const checkbox = card.querySelector('input');
            checkbox.addEventListener('change', (e) => {
                if (e.target.checked) {
                    selectedLeagueIds.add(league.id);
                } else {
                    selectedLeagueIds.delete(league.id);
                }
                renderList(); // 重新刷新界面
            });

            return card;
        }

        // 渲染右侧 A-Z 快捷导航栏
        function renderAlphabetBar(keys) {
            alphabetNav.innerHTML = '';
            keys.forEach(k => {
                const item = document.createElement('div');
                item.className = 'py-0.5 px-1 hover:text-hank-primary cursor-pointer active-scale';
                item.textContent = k;
                item.addEventListener('click', () => {
                    const el = document.getElementById(`sec-${k}`);
                    if (el) el.scrollIntoView({ behavior: 'smooth' });
                });
                alphabetNav.appendChild(item);
            });
        }

        // 更新数量统计数据
        function updateCounts() {
            const selectedCount = selectedLeagueIds.size;
            let matchCount = 0;

            allLeagues.forEach(l => {
                if (selectedLeagueIds.has(l.id)) {
                    matchCount += l.matchCount;
                }
            });

            document.getElementById('selected-count-num').textContent = selectedCount;
            document.getElementById('bottom-selected-leagues').textContent = selectedCount;
            document.getElementById('bottom-selected-matches').textContent = matchCount;
            document.getElementById('submit-match-badge').textContent = matchCount;

            document.getElementById('total-stats-subtitle').textContent = 
                `共 ${liansaiJsonData.data.totalLeagues} 个联赛 · ${liansaiJsonData.data.totalMatches} 场精彩赛事`;
        }

        // 绑定 Tab 切换点击
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => {
                    b.className = 'tab-btn px-3.5 py-1.5 rounded-lg bg-hank-card text-zinc-400 border border-hank-border/60 hover:text-white whitespace-nowrap active-scale';
                });
                this.className = 'tab-btn px-3.5 py-1.5 rounded-lg bg-hank-primary text-slate-950 font-bold whitespace-nowrap active-scale';
                
                currentTab = this.dataset.tab;
                renderList();
            });
        });

        // 搜索框过滤事件
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value.trim();
            if (searchQuery.length > 0) {
                searchClear.classList.remove('hidden');
            } else {
                searchClear.classList.add('hidden');
            }
            renderList();
        });

        // 清空搜索
        searchClear.addEventListener('click', () => {
            searchInput.value = '';
            searchQuery = '';
            searchClear.classList.add('hidden');
            renderList();
        });

        // 按钮事件：全选
        document.getElementById('btn-select-all').addEventListener('click', () => {
            const currentDisplayed = getFilteredLeagues();
            currentDisplayed.forEach(l => selectedLeagueIds.add(l.id));
            showToast('已全选当前列表联赛');
            renderList();
        });

        // 按钮事件：反选
        document.getElementById('btn-invert').addEventListener('click', () => {
            const currentDisplayed = getFilteredLeagues();
            currentDisplayed.forEach(l => {
                if (selectedLeagueIds.has(l.id)) {
                    selectedLeagueIds.delete(l.id);
                } else {
                    selectedLeagueIds.add(l.id);
                }
            });
            showToast('已完成反选');
            renderList();
        });

        // 按钮事件：五大联赛
        document.getElementById('btn-big5').addEventListener('click', () => {
            selectedLeagueIds.clear();
            allLeagues.filter(l => l.isBig5).forEach(l => selectedLeagueIds.add(l.id));
            showToast('已选中欧洲五大联赛');
            renderList();
        });

        // 按钮事件：重置
        document.getElementById('btn-reset').addEventListener('click', () => {
            selectedLeagueIds.clear();
            allLeagues.filter(l => l.isHot).forEach(l => selectedLeagueIds.add(l.id));
            searchInput.value = '';
            searchQuery = '';
            searchClear.classList.add('hidden');
            showToast('已恢复默认热门联赛');
            renderList();
        });

        // 确定提交
        document.getElementById('btn-submit').addEventListener('click', () => {
            const count = selectedLeagueIds.size;
            let matches = 0;
            allLeagues.forEach(l => {
                if (selectedLeagueIds.has(l.id)) matches += l.matchCount;
            });

            showToast(`成功筛选 ${count} 个联赛 (${matches} 场比赛)`);
        });

        // 返回按钮
        document.getElementById('btn-close').addEventListener('click', () => {
            showToast('已返回上一页');
        });

        // 初始化首次渲染
        renderList();
    </script>
</body>
</html>
